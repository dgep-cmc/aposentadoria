name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Altere para o nome da sua branch principal se for diferente (ex: master)

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Pasta que contem os arquivos compilados de producao
          branch: gh-pages # Branch destino para o Github Pages
